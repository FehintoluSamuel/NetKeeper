
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>WiKeep</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand"><img src="icon.png" width="32"/> WiKeep</div>
    <div class="card">
      <div class="row"><span class="dot ok" id="statusDot"></span> <b id="ssidVal">--</b></div>
      <div class="muted" id="ipVal">--</div>
      <button onclick="doDisconnect()" class="btn danger">Disconnect / Power Cycle</button>
    </div>
    <div class="card">
      <div class="label">Selected</div>
      <div id="selSsid" class="sel">None</div>
      <input id="pw" type="password" placeholder="Password"/>
      <button id="joinBtn" disabled onclick="doConnect()" class="btn primary">Join</button>
    </div>
  </div>
  <div class="main">
    <div class="toolbar">
      <h2>Available Networks <span id="count">0</span></h2>
      <input id="search" placeholder="Search SSID..."/>
      <button onclick="refresh()" class="btn">Scan</button>
    </div>
    <table><thead><tr><th>SSID</th><th>RSSI</th><th>Ch</th><th>Quality</th></tr></thead><tbody id="netList"></tbody></table>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
